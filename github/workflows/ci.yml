name: CI Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          java-version: 21

      - name: Cache Maven packages
        uses: actions/chache@v3
        with:
          path: ~/.m2
          key: ${{runner.os}}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{runner.os}}-maven

      - name: Run Tests
        run: mvn clean test allure-report